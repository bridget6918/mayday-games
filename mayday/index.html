<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五月天全歌曲二选一</title>
    <style>
        :root {
            --primary-blue: #20a0ff;
            --dark-blue: #0a2540;
            --bg-color: #f5f9fc;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-blue);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: var(--primary-blue);
            margin-bottom: 5px;
        }

        .progress {
            font-size: 14px;
            color: #666;
        }

        .vs-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }

        .song-card {
            background: white;
            border: 2px solid #e1e8ed;
            border-radius: 16px;
            padding: 35px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .song-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-blue);
            box-shadow: 0 6px 12px rgba(32,160,255,0.15);
        }

        .song-card:active {
            transform: scale(0.98);
        }

        .song-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e6f4ff;
            color: var(--primary-blue);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .vs-divider {
            font-size: 18px;
            font-weight: 800;
            color: #ccc;
            font-style: italic;
            margin: 5px 0;
        }

        .result-screen {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-top: 40px;
            display: none;
        }

        .restart-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background: #1886dc;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>五月天全歌曲大逃杀</h1>
        <div class="progress" id="progress">准备开始...</div>
    </header>

    <!-- 游戏主界面 -->
    <div class="vs-container" id="game-interface">
        <div class="song-card" onclick="choose(1)">
            <div class="badge" id="card1-badge">当前擂主</div>
            <div class="song-title" id="song1">歌曲 A</div>
        </div>
        
        <div class="vs-divider">VS</div>
        
        <div class="song-card" onclick="choose(2)">
            <div class="badge" style="background:#fff0f6; color:#ff4d4f;">挑战者</div>
            <div class="song-title" id="song2">歌曲 B</div>
        </div>
    </div>

    <!-- 结果结算界面 -->
    <div class="result-screen" id="result-interface">
        <p style="font-size: 18px; color:#555;">经过史诗级的神仙打架，你心中的五月天终极神曲是：</p>
        <h2 id="ultimate-winner" style="font-size: 32px; color: var(--primary-blue); margin: 20px 0;"></h2>
        <p style="font-size: 14px; color:#888;" id="battle-count"></p>
        <button class="restart-btn" onclick="initGame()">重新开启巡演</button>
    </div>

    <footer>
        加入五月天，永远不会太迟 🖐️
    </footer>
</div>

<script>
    // 经过严格 Feedback 清洗后的五月天核心全曲目池
    const allSongs = [
        // 第一张《第一张创作专辑》
        "疯狂世界", "拥抱", "透露", "生活", "爱情的模样", "嘿我要走了", "轧车", "志明与春娇", "HoSee", "黑白讲", "I Love You 无望", "风若吹",
        // 第二张《爱情万岁》
        "为什么", "终结孤单", "明白", "心中无别人", "憨人", "叫我第一名", "雨眠", "罗密欧与茱丽叶", "温柔", "爱情万岁", "反而",
        // 第三张《人生海海》
        "一颗苹果", "能不能不要说", "彩虹", "啾啾啾", "纯真", "OK啦", "借问众神明", "永远的永远", "人生海海",
        // 第四张《时光机》
        "轻功", "恒星的恒心", "雌雄同体", "阿姆斯壮", "而我知道", "赌神", "别惹我", "九号球", "武装", "时光机", "我们(时时刻刻)", "在这一秒", "生命有一种绝对",
        // 第五张《神的孩子都在跳舞》
        "孙悟空", "倔强", "垃圾车", "晚安地球人", "超人", "神的孩子都在跳舞", "恋爱ing", "错错错", "冲浪", "听不到",
        // 第六张《为爱而生》
        "为爱而生", "天使", "我又初恋了", "香水", "摩托车日记", "最重要的小事", "快乐很伟大", "乱世浮生", "米老鼠", "一千个世纪",
        // 第七张《后青春期的诗》
        "突然好想你", "生存以上生活以下", "你不是真正的快乐", "爆肝", "噢买尬", "出头天", "我心中尚未崩坏的地方", "春天的呐喊", "夜访吸血鬼", "如烟", "后青春期的诗", "笑忘歌",
        // 第八张《第二人生》
        "2012", "仓颉", "洗衣机", "歪腰", "干杯", "我不愿让你一个人", "星空", "三个傻瓜", "末日", "第二人生", "好好(想把你写成一首歌)", "诺亚方舟", "有些事现在不做一辈子都不会做了",
        // 第九张《自传》
        "如果我们不曾相遇", "成名在望", "兄弟", "人生有限公司", "后来的我们", "顽固", "派对动物", "最好的一天", "少年他的奇幻漂流", "终于结束的起点", "任意门", "转眼",
        // 重要单曲 / 影视合作 / 近期新歌
        "伤心的人别听慢歌", "入阵曲", "步步", "将军令", "为你写下这首情歌", "因为你所以我", "青空未来", "盛夏光年", "洋葱", "私奔到月球", "小太阳", "DNA"
    ];

    // 去重处理
    const uniqueSongs = [...new Set(allSongs)];

    let playlist = [];
    let currentKing = "";
    let nextIndex = 0;
    let roundCount = 0;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        playlist = shuffle([...uniqueSongs]);
        currentKing = playlist[0];
        nextIndex = 1;
        roundCount = 1;

        document.getElementById('game-interface').style.display = 'flex';
        document.getElementById('result-interface').style.display = 'none';
        
        updateUI();
    }

    function updateUI() {
        if (nextIndex < playlist.length) {
            document.getElementById('song1').innerText = currentKing;
            document.getElementById('song2').innerText = playlist[nextIndex];
            
            document.getElementById('progress').innerText = `第 ${roundCount} 轮 / 剩 ${playlist.length - nextIndex} 首 (总计 ${playlist.length} 首)`;
            document.getElementById('card1-badge').innerText = roundCount === 1 ? "首发 A" : "当前擂主";
        } else {
            document.getElementById('game-interface').style.display = 'none';
            document.getElementById('result-interface').style.display = 'block';
            document.getElementById('ultimate-winner').innerText = `《${currentKing}》`;
            document.getElementById('battle-count').innerText = `历经 ${roundCount - 1} 场神仙打架，终成蓝色荧光海的绝对 C 位！`;
            document.getElementById('progress').innerText = "选拔完成！";
        }
    }

    function choose(winnerSlot) {
        if (winnerSlot === 2) {
            currentKing = playlist[nextIndex];
        }
        nextIndex++;
        roundCount++;
        updateUI();
    }

    window.onload = initGame;
</script>
</body>
</html>
